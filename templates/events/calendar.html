{% extends 'base.html' %}
{% load static %}

{% block title %}Calendar — Art Around Town Dayton{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h1 class="mb-0">Art Around Town Calendar</h1>
    <div class="d-flex gap-2">
        <a href="{% url 'calendar-embed' %}" class="btn btn-outline-secondary btn-sm" target="_blank">
            Embed this calendar
        </a>
    </div>
</div>

<div class="category-filter mb-3" role="group" aria-label="Filter events by category">
    <button type="button" class="cat-pill active" data-category="" style="--cat-color: var(--color-dark)">All</button>
    {% for c in categories %}
    <button type="button" class="cat-pill" data-category="{{ c.value }}" style="--cat-color: {{ c.color }}">{{ c.label }}</button>
    {% endfor %}
</div>

<div id="calendar"></div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var params = new URLSearchParams(window.location.search);
    var activeCategory = params.get('category') || '';
    var pills = document.querySelectorAll('.cat-pill');

    function syncPills() {
        pills.forEach(function (p) {
            p.classList.toggle('active', p.dataset.category === activeCategory);
        });
    }

    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: params.get('view') || 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,listMonth'
        },
        eventColor: '#E8523A',
        events: function (info, success, failure) {
            var url = '/api/events/calendar/?start=' + encodeURIComponent(info.startStr) +
                      '&end=' + encodeURIComponent(info.endStr);
            if (activeCategory) url += '&category=' + encodeURIComponent(activeCategory);
            fetch(url)
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(success)
                .catch(function () {
                    failure();
                    calendarEl.insertAdjacentHTML('beforebegin',
                        '<div class="alert alert-warning">Could not load events. Please try refreshing the page.</div>');
                });
        },
        eventClick: function (info) {
            info.jsEvent.preventDefault();
            var slug = info.event.extendedProps.slug;
            if (slug) {
                window.location.href = '/events/' + slug + '/';
            }
        },
        eventDidMount: function (info) {
            var props = info.event.extendedProps;
            var bits = [];
            if (props.category_display) bits.push(props.category_display);
            if (props.location) bits.push(props.location);
            if (bits.length) info.el.title = bits.join(' · ');
            // In list view, show category + venue under the title
            var titleEl = info.el.querySelector('.fc-list-event-title');
            if (titleEl && bits.length) {
                var sub = document.createElement('div');
                sub.className = 'fc-event-sub';
                sub.textContent = bits.join(' · ');
                titleEl.appendChild(sub);
            }
        }
    });
    calendar.render();
    syncPills();

    pills.forEach(function (pill) {
        pill.addEventListener('click', function () {
            activeCategory = pill.dataset.category;
            syncPills();
            calendar.refetchEvents();
            var qs = new URLSearchParams(window.location.search);
            if (activeCategory) qs.set('category', activeCategory); else qs.delete('category');
            var q = qs.toString();
            history.replaceState(null, '', window.location.pathname + (q ? '?' + q : ''));
        });
    });
});
</script>
{% endblock %}
