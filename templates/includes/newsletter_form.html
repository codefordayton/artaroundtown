{% if NEWSLETTER_FORM_URL %}
<a href="{{ NEWSLETTER_FORM_URL }}" target="_blank" rel="noopener"
   class="btn btn-primary newsletter-link {{ extra_class|default:'' }}">Sign up for the newsletter</a>
{% elif NEWSLETTER_ENABLED %}
<form method="post" action="{% url 'newsletter-signup' %}" class="newsletter-form {{ extra_class|default:'' }}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <div class="nl-honeypot" aria-hidden="true">
    <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
  </div>
  <label class="visually-hidden" for="nl-email-{{ extra_class|default:'x' }}">Email address</label>
  <div class="newsletter-row">
    <input type="email" name="email" id="nl-email-{{ extra_class|default:'x' }}" class="form-control"
           placeholder="you@example.com" required autocomplete="email">
    <button type="submit" class="btn btn-primary">Sign up</button>
  </div>
</form>
{% endif %}
